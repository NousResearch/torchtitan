# Profiling config for EP=2

[job]
dump_folder = "./outputs_profile_ep2"
description = "Qwen3 32B training - EP=2 profiling"

[profiling]
enable_profiling = true
save_traces_folder = "profile_trace"
profile_freq = 5
profiler_warmup = 2
profiler_active = 2

[metrics]
log_freq = 1
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "qwen3"
flavor = "30B-A3B"
hf_assets_path = "./assets/hf/Qwen3-32B"

[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 600

[training]
local_batch_size = 6
seq_len = 4096
max_norm = 1.0
steps = 10
dataset = "c4"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
context_parallel_degree = 1
expert_parallel_degree = 2

[checkpoint]
enable = false

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable=false

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

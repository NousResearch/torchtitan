[job]
dump_folder = "/tmp/probe"
description = "probe 30B"
[profiling]
enable_profiling = false
[metrics]
log_freq = 1
enable_tensorboard = false
enable_wandb = false
[model]
name = "qwen3"
flavor = "30B-A3B"
[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8
[lr_scheduler]
warmup_steps = 2
[training]
local_batch_size = 2
global_batch_size = 16
seq_len = 4096
max_norm = 1.0
steps = 10
dataset = "c4"
enable_cpu_offload = false
enable_activation_offload = true
activation_offload_modules = "expert_fc1"
activation_offload_min_tensor_size = 1024
[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
context_parallel_degree = 1
expert_parallel_degree = 8
[checkpoint]
enable = false
[activation_checkpoint]
mode = "none"
[compile]
enable = false

# exp1be13 with bf16 optimizer states
# Testing reduced memory footprint for optimizer states
# Expected: ~335GB optimizer states (vs ~670GB for fp32)
[job]
dump_folder = "./outputs/exp1be13_bf16_optim_states"
description = "exp1be13_bf16_optim_states"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "./assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4
state_dtype = "bfloat16"  # KEY: Use bf16 for optimizer states

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
local_batch_size = 6
seq_len = 32768
steps = 10
dataset = "c4_test"
enable_cpu_offload = true
clear_cache_between_steps = true
skip_optimizer_step = false  # ENABLED: Test optimizer with bf16 states

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 64
context_parallel_degree = 8

[activation_checkpoint]
mode = "full"

[compile]
enable = false

[debug]
moe_force_load_balance = true

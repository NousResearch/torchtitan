# exp1be13 with bf16 optimizer states - batch_size=4 (reduced from 6)
# Testing if reduced batch size eliminates memory pressure during backward
[job]
dump_folder = "./outputs/exp1be13_bf16_optim_states_batch4"
description = "exp1be13_bf16_optim_states_batch4"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "./assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4
state_dtype = "bfloat16"

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
local_batch_size = 4  # REDUCED from 6 to save ~100GB cache
seq_len = 32768
steps = 10
dataset = "c4_test"
enable_cpu_offload = true
clear_cache_between_steps = true
skip_optimizer_step = false

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 64
context_parallel_degree = 8

[activation_checkpoint]
mode = "full"

[compile]
enable = false

[debug]
moe_force_load_balance = true

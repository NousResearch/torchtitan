# exp1be13 with FP32 optimizer states + LONG NCCL TIMEOUTS
# Testing if training can complete with standard optimizer + long timeout
[job]
dump_folder = "./outputs/exp1be13_fp32_long_timeout"
description = "exp1be13_fp32_long_timeout"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "./assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4
# NO state_dtype - use default fp32

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
local_batch_size = 4
seq_len = 32768
steps = 3
dataset = "c4_test"
enable_cpu_offload = true
clear_cache_between_steps = true
skip_optimizer_step = false

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 64
context_parallel_degree = 8

[activation_checkpoint]
mode = "full"

[compile]
enable = false

[debug]
moe_force_load_balance = true

# LONG TIMEOUTS
[comm]
init_timeout_seconds = 1800
train_timeout_seconds = 1800

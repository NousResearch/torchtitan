# Comprehensive profiling of DeepEP, LBS=1, seq=8k, CP=1, EP=64 (1,210 TPS baseline)
[job]
dump_folder = "./outputs/profiling_deepep_lbs1_1210tps"
description = "Profiling: DeepEP LBS=1 8k CP=1 EP=64 (1210 TPS)"
print_config = false
[profiling]
enable_profiling = true
with_stack = true
with_modules = true
save_traces_folder = "profile_traces"
profile_freq = 5
profiler_warmup = 3
profiler_active = 1
enable_memory_snapshot = true
save_memory_snapshot_folder = "memory_snapshot"
[metrics]
log_freq = 1
disable_color_printing = true
enable_wandb = false
[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "./tests/assets/tokenizer"
[optimizer]
name = "AdamW"
lr = 2.2e-4
eps = 1e-8
[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8
[training]
local_batch_size = 1
seq_len = 8192
steps = 7
dataset = "c4_test"
enable_cpu_offload = false
dtype = "bfloat16"
max_norm = 10.0
[parallelism]
data_parallel_shard_degree = -1
data_parallel_replicate_degree = 1
expert_parallel_degree = 64
context_parallel_degree = 1
expert_parallel_comm_backend = "deepep"
[activation_checkpoint]
mode = "full"
[compile]
enable = true
components = ["loss"]
[deepep]
sync_comm_stream = false
fused_weighted_scatter_add = false
fused_silu_gate_prob = false
[debug]
moe_force_load_balance = true
[comm]
init_timeout_seconds = 1800
train_timeout_seconds = 1800
[checkpoint]
enable = false

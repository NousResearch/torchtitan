# exp1be13 with FULL BF16 training - params AND optimizer states in bf16
# Using [training].dtype = "bfloat16" to store params in bf16 from the start
[job]
dump_folder = "./outputs/exp1be13_full_bf16"
description = "exp1be13_full_bf16"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "./assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4
state_dtype = "bfloat16"
# Using default fused implementation

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
# KEY SETTING: Store params in bf16 from the start
dtype = "bfloat16"
local_batch_size = 4
seq_len = 32768
steps = 3
dataset = "c4_test"
enable_cpu_offload = true
clear_cache_between_steps = true
skip_optimizer_step = false

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 64
context_parallel_degree = 8

[activation_checkpoint]
mode = "full"

[compile]
enable = false

[debug]
moe_force_load_balance = true

# LONG TIMEOUTS
[comm]
init_timeout_seconds = 1800
train_timeout_seconds = 1800

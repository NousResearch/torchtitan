# exp1bf3 with FULL BF16 + COMPILE LOSS + ALL FIXES
# Original: 12n, EP96, CP4, LBS6, ctx16k
# Changes: dtype=bf16, state_dtype=bf16, compile loss, long timeouts, skip_optimizer_step=false
[job]
dump_folder = "./outputs/exp1b/exp1bf3_full_bf16_compile"
description = "exp1bf3_full_bf16_compile"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "./assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4
state_dtype = "bfloat16"

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
dtype = "bfloat16"
local_batch_size = 6
seq_len = 16384
steps = 5
dataset = "c4_test"
enable_cpu_offload = true
clear_cache_between_steps = true
skip_optimizer_step = false

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 96
context_parallel_degree = 4

[activation_checkpoint]
mode = "full"

[compile]
enable = true
components = ["loss"]

[debug]
moe_force_load_balance = true

[comm]
init_timeout_seconds = 1800
train_timeout_seconds = 1800

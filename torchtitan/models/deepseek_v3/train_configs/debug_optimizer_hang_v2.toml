# Debug config for optimizer hang - matches exp1be13_baseline but with optimizer enabled
# Based on exp1be13_baseline.toml exactly, only changing skip_optimizer_step
[job]
dump_folder = "./outputs/debug_optimizer_hang_v2"
description = "debug_optimizer_hang_v2"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "./assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
local_batch_size = 6
seq_len = 32768
steps = 2
dataset = "c4_test"
enable_cpu_offload = true
clear_cache_between_steps = true
# KEY CHANGE: Enable optimizer step to test the hang
skip_optimizer_step = false

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 64
context_parallel_degree = 8

[activation_checkpoint]
mode = "full"

[compile]
enable = false

[debug]
moe_force_load_balance = true

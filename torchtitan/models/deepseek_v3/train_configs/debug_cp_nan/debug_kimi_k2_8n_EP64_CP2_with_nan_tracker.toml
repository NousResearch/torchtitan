# Big model config WITH NaN tracker enabled for debugging
# Run with: srun -N 8 --ntasks-per-node=8 --gpus-per-node=8 python -m torchtitan.train --config <this_config>

[job]
dump_folder = "./outputs/debug_cp_nan/kimi_k2_8n_EP64_CP2_nan_tracker"
description = "Debug kimi_k2 NaN with NaN tracker enabled"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "./assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
local_batch_size = 1
seq_len = 16384
steps = 5
dataset = "c4_test"
enable_cpu_offload = true
clear_cache_between_steps = true
skip_optimizer_step = true

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 64
context_parallel_degree = 2

[activation_checkpoint]
mode = "full"

[compile]
enable = false

[debug]
moe_force_load_balance = true
enable_nan_tracker = true
nan_tracker_verbose = false  # Set to true for per-layer stats

# Test SMALL debugmodel with CP=2 WITH cpu_offload
# The small model crashed before - does cpu_offload help?

[job]
dump_folder = "./outputs/debug_cp_nan/small_cp2_with_offload"
description = "Test small model CP=2 WITH cpu_offload"
print_config = false

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "debugmodel_flex_attn_causal"  # Small model that crashed
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 8e-4

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
local_batch_size = 1
seq_len = 256
max_norm = 1.0
steps = 5
dataset = "c4_test"
dtype = "bfloat16"
enable_cpu_offload = true  # Enable cpu offload
clear_cache_between_steps = true

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 2
expert_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "full"
cpu_offload = false

[compile]
enable = false

[debug]
moe_force_load_balance = true

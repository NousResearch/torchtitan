# Config for debugging NaN with NaN tracker enabled
# Run with: torchrun --nproc_per_node=8 -m torchtitan.train --job.config_file <this_config>

[job]
dump_folder = "./outputs/debug_cp_nan/1b_cp2_nan_tracker"
description = "Debug NaN with NaN tracker enabled"
print_config = false

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "debugmodel_1b_flex_attn"
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 2.2e-4

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
local_batch_size = 1
seq_len = 4096
max_norm = 1.0
steps = 5
dataset = "c4_test"
dtype = "bfloat16"
enable_cpu_offload = true
clear_cache_between_steps = true
skip_optimizer_step = false

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 2
expert_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "full"
cpu_offload = false

[compile]
enable = false

[debug]
moe_force_load_balance = true
enable_nan_tracker = true
nan_tracker_verbose = false

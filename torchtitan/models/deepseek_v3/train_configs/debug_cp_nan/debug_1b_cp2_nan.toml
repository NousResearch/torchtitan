# DeepSeek V3 ~1B debug model - CP=2 (should reproduce NaN gradient bug)
# Single node reproduction for CP NaN gradient bug

[job]
dump_folder = "./outputs/debug_cp_nan/cp2_nan"
description = "DeepSeek-V3 ~1B CP=2 - should reproduce NaN loss"
print_config = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "deepseek_v3"
flavor = "debugmodel_1b"  # ~1B parameters, 8 experts
# test tokenizer, for debug purpose only
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8
decay_type = "linear"
min_lr_factor = 0.0

[training]
local_batch_size = 1
seq_len = 4096
max_norm = 1.0
steps = 5
dataset = "c4_test"
dtype = "bfloat16"
enable_cpu_offload = false

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
pipeline_parallel_schedule = "1F1B"
context_parallel_degree = 2  # CP=2 - should cause NaN
expert_parallel_degree = 8   # 1 expert per GPU
expert_tensor_parallel_degree = 1

[checkpoint]
enable = false
folder = "checkpoint"
interval = 10
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"

[activation_checkpoint]
mode = "full"
selective_ac_option = 'op'
cpu_offload = false

[compile]
enable = false
components = ["model", "loss"]

[debug]
moe_force_load_balance = true

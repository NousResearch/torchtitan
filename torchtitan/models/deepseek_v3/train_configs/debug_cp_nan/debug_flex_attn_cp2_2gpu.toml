# DeepSeek V3 debug model with FlexAttention + CP=2 (2 GPU version)
# Tests if the NaN comes from FlexAttention + CP combination

[job]
dump_folder = "./outputs/debug_cp_nan/flex_attn_cp2_2gpu"
description = "DeepSeek-V3 debugmodel_flex_attn with CP=2 (2 GPUs)"
print_config = false

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "deepseek_v3"
flavor = "debugmodel_flex_attn"  # FlexAttention with block_causal mask
# test tokenizer, for debug purpose only
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8
decay_type = "linear"
min_lr_factor = 0.0

[training]
local_batch_size = 1
seq_len = 256
max_norm = 1.0
steps = 3
dataset = "c4_test"
dtype = "bfloat16"
enable_cpu_offload = false

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1  # FSDP sharding
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
pipeline_parallel_schedule = "1F1B"
context_parallel_degree = 1  # CP=1 baseline test
expert_parallel_degree = 1   # No EP for 2 GPU test

[checkpoint]
enable = false
folder = "checkpoint"
interval = 10
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"

[activation_checkpoint]
mode = "full"
selective_ac_option = 'op'
cpu_offload = false

[compile]
enable = false
components = ["model", "loss"]

[debug]
moe_force_load_balance = true

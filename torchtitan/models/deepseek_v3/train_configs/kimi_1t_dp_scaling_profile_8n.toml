# DP SCALING PROFILING: 8 nodes baseline
# Purpose: Compare with 16-node profiling to identify DP scaling bottleneck
# Configuration: 8 nodes, 64 GPUs, EP=64, CP=8, seq=32768, batch=6

[job]
dump_folder = "./outputs/dp_scaling_profile_8n"
description = "DP Scaling Profile - 8 nodes baseline"

[profiling]
enable_profiling = true
profile_freq = 5
profiler_warmup = 1
profiler_active = 2
with_stack = true
with_modules = true

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "/home/phuc/kimi_1t/torchtitan/assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
local_batch_size = 6
seq_len = 32768
steps = 5
dataset = "c4_test"
enable_cpu_offload = true
enable_detailed_memory_tracking = false
clear_cache_between_steps = true
skip_optimizer_step = true

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 64
context_parallel_degree = 8

[activation_checkpoint]
mode = "full"

[compile]
enable = false

[debug]
moe_force_load_balance = true

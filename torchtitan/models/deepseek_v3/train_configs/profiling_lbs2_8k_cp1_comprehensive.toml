# Comprehensive profiling of LBS=2, seq=8k, CP=1, EP=64 (726 TPS baseline)
# Matches seqlen_8k_cp1_lbs2.toml exactly, but with all profiling enabled
[job]
dump_folder = "./outputs/profiling_lbs2_726tps"
description = "Comprehensive profiling: LBS=2 8k CP=1 EP=64 (726 TPS baseline)"
print_config = false
[profiling]
enable_profiling = true
with_stack = true
with_modules = true
save_traces_folder = "profile_traces"
profile_freq = 5
profiler_warmup = 3
profiler_active = 1
enable_memory_snapshot = true
save_memory_snapshot_folder = "memory_snapshot"
[metrics]
log_freq = 1
disable_color_printing = true
enable_wandb = false
[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "./tests/assets/tokenizer"
[optimizer]
name = "AdamW"
lr = 2.2e-4
eps = 1e-8
[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8
[training]
local_batch_size = 2
seq_len = 8192
steps = 7
dataset = "c4_test"
enable_cpu_offload = false
dtype = "bfloat16"
max_norm = 10.0
[parallelism]
data_parallel_shard_degree = -1
data_parallel_replicate_degree = 1
expert_parallel_degree = 64
context_parallel_degree = 1
[activation_checkpoint]
mode = "full"
[compile]
enable = true
components = ["loss"]
[debug]
moe_force_load_balance = true
[comm]
init_timeout_seconds = 1800
train_timeout_seconds = 1800
[checkpoint]
enable = false

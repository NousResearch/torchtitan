# torchtitan Config.toml
# NOTE: this toml config is a preset for 64 A100 GPUs.

[job]
dump_folder = "./outputs"
description = "Mistral 24B training"


[profiling]
enable_profiling = true
save_traces_folder = "profile_trace"
profile_freq = 100

[metrics]
log_freq = 10
enable_tensorboard = false
enable_wandb = true
save_tb_folder = "tb"

[model]
name = "mistral3"
flavor = "24B"
tokenizer_path = "/home/shared/torchtitan-conversions/mistral_small_3.1_instruct/tokenizer"

[optimizer]
name = "AdamW"
lr = 2e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 0 # lr scheduler warm up

[training]
local_batch_size = 1
seq_len = 16384
max_norm = 1.0  # grad norm clipping
steps = 100
compile = false
dataset = "hermes4"
dataset_path = "./multimodal_dataset"
dataset_type = "preprocessed_multimodal"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable_checkpoint = true
initial_load_path = "/home/shared/torchtitan-conversions/mistral_small_3.1_instruct"
folder = "checkpoint"
interval = 500
last_save_model_weights_only = false
export_dtype = "float32"
async_mode = "disabled" # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = "none"  # ["none", "selective", "full"]
selective_ac_option = "op"  # "int" = ac every positive int layer or 'op', ac based on ops policy

[float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

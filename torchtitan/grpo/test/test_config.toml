# torchtitan config.toml - GSM8k Test Configuration
# Test configuration for Qwen3-1.7B on GSM8k environment

[job]
dump_folder = "/tmp/gsm8k_test_run"
description = "gsm8k_qwen3_1.7b_test"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100

[metrics]
log_freq = 1
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "qwen3"
flavor = "1.7B"
tokenizer_path = "Qwen/Qwen3-1.7B"

[optimizer]
name = "AdamW"
lr = 1e-6
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1

[lr_scheduler]
warmup_steps = 10
decay_type = "linear"
decay_ratio = 0.1

[training]
local_batch_size = 1
seq_len = 2048           
global_batch_size = 32    # 8 rollouts * 4 gradient accumulation steps

max_norm = 0.25           # grad norm clipping
steps = 100               # test run - 100 steps to validate pipeline

[compile]
enable = false
components = ["model", "loss"]

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1  # Use all available GPUs for data parallel sharding
tensor_parallel_degree = 1
context_parallel_degree = 1
pipeline_parallel_degree = 1

[grpo]
sglang_tp = 1
sglang_urls = ["localhost:9001"]
sglang_slurm_num_nodes = 1
sglang_port = 26756

# GRPO hyperparameters
logit_loss_weight = 0.0
entropy_loss_weight = 0.0000
kl_beta = 0.000
kl_estimator_type = "k3"
ref_model_ema = 0.999
clip_ratio_lower_bound = 0.0003
clip_ratio_upper_bound = 0.0004
policy_ratio_type = "sequence"
pos_scaler = 1.00
neg_scaler = 1.00
grpo_by_token = true
scale_adv_by_len = false
num_microbatches = 2
onpolicy_logp_threshold = 0.0
rollout_is_level = "sequence"
rollout_is_mode = "truncate"
rollout_is_threshold = 4.0

# disabled for this test
ptx_mixin_batchsize = 0
ptx_scale_by_tokens = false

[checkpoint]
enable = true
folder = "checkpoints"
# Update this path to point to your Qwen3-1.7B checkpoint
initial_load_path = "/home/shared/torchtitan-conversions/qwen3_1.7b"
initial_load_legacy = true
interval = 50
export_dtype = "float32"
async_mode = "disabled"  # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = 'selective'  # ['none', 'selective', 'full']
selective_ac_option = 'op'  # 'int' = ac every positive int layer or 'op', ac based on ops policy

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false

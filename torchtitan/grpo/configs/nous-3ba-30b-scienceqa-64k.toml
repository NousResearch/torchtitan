# torchtitan Config.toml
# NOTE: this toml config is a preset for 64 A100 GPUs.

[job]
dump_folder = "/data/home/mormio/torchtitan-grpo/outputs/3ba_30b_scienceqa_64k"
description = "3ba_30b_scienceqa_grpo_64k"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100

[metrics]
log_freq = 1
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = true

[model]
name = "qwen3"
flavor = "30B-A3B"
hf_assets_path = "/home/mormio/torchtitan/assets/hf/Qwen3-30B-A3B-Instruct-2507"
# converters = "float8"

[optimizer]
name = "AdamW"
lr = 1e-6
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
# reset_state_every_n_steps = 100

[lr_scheduler]
warmup_steps = 10
decay_type="linear"
decay_ratio=0.1

[training]
local_batch_size = 1
seq_len = 65536
global_batch_size = 256

max_norm = 0.25  # grad norm clipping
steps = 1000
dataset = "c4"

[compile]
enable=false
components = ["model", "loss"]

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
context_parallel_degree = 1
pipeline_parallel_degree = 1

[grpo]
sglang_tp = 1
sglang_urls = ["localhost:9004", "localhost:9005", "localhost:9006", "localhost:9007"]
sglang_slurm_num_nodes = 2
sglang_port = 26756
logit_loss_weight = 0.0
entropy_loss_weight = 0.0000
kl_beta = 0.000
kl_estimator_type = "k3"
ref_model_ema = 0.999
clip_ratio_lower_bound = 0.0003
clip_ratio_upper_bound = 0.0004
policy_ratio_type = "sequence"
pos_scaler = 1.00
neg_scaler = 1.00
grpo_by_token = true
scale_adv_by_len = false
num_microbatches = 16
onpolicy_logp_threshold = 0.0
rollout_is_level = "sequence"
rollout_is_mode = "truncate"
# rollout_is_threshold = 4.0  # disabled: was zeroing out importance_ratio → loss=0

[checkpoint]
enable = true
folder = "checkpoints"
interval = 10
initial_load_path = "/home/mormio/models/qwen3_30b_a3b_scienceqa_20260128_ckpt191"
initial_load_in_hf = true
last_save_model_only = true
last_save_in_hf = true
export_dtype = "bfloat16"
async_mode = "disabled" # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = 'full'  # ['none', 'selective', 'full']
selective_ac_option = 'op'  # 'int' = ac every positive int layer or 'op', ac based on ops policy

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false

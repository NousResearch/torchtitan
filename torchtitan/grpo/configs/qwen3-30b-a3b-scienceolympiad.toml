# torchtitan GRPO Config — Qwen3-30B-A3B, ScienceOlympiad env
# Load from SFT HF checkpoint, single-node 8-GPU setup:
#   GPUs 0-3: torchtitan training (FSDP)
#   GPUs 4-7: sglang inference (2 instances, tp=2 each)

[job]
dump_folder = "/home/mormio/torchtitan/outputs/qwen3_30b_a3b_grpo_scioly"
description = "qwen3_30b_a3b_grpo_scienceolympiad"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100

[metrics]
log_freq = 1
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = true

[model]
name = "qwen3"
flavor = "30B-A3B"
# Tokenizer and model config — use original HF assets dir for tokenizer files
hf_assets_path = "/home/mormio/torchtitan/assets/hf/Qwen3-30B-A3B-Instruct-2507"

[optimizer]
name = "AdamW"
lr = 1e-6
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1

[lr_scheduler]
warmup_steps = 10
decay_type = "linear"
decay_ratio = 0.1

[training]
local_batch_size = 1
seq_len = 16384
global_batch_size = 64
max_norm = 0.25
steps = 1000
dataset = "c4"

[compile]
enable = true
components = ["model", "loss"]

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1  # auto = 4 GPUs for training
tensor_parallel_degree = 1
context_parallel_degree = 1
pipeline_parallel_degree = 1

[grpo]
# 2 sglang instances with tp=2 each (4 GPUs total, needed for 30B weights ~60GB)
# adjust to sglang_tp=1 + 4 urls if your GPUs have enough VRAM (>80GB each)
sglang_tp = 2
sglang_urls = ["localhost:9004", "localhost:9006"]
sglang_slurm_num_nodes = 1
sglang_port = 26756
logit_loss_weight = 0.0
entropy_loss_weight = 0.0
kl_beta = 0.0
kl_estimator_type = "k3"
ref_model_ema = 0.999
clip_ratio_lower_bound = 0.0003
clip_ratio_upper_bound = 0.0004
policy_ratio_type = "sequence"
pos_scaler = 1.00
neg_scaler = 1.00
grpo_by_token = true
scale_adv_by_len = false
num_microbatches = 2
onpolicy_logp_threshold = 0.0
rollout_is_level = "sequence"
rollout_is_mode = "truncate"
rollout_is_threshold = 4.0

[checkpoint]
enable = true
folder = "checkpoints"
# Load from your SFT HF checkpoint
initial_load_path = "/home/mormio/torchtitan/outputs/qwen3_30b_a3b_sft_unverified_old_params/checkpoint/step-191-hf"
initial_load_in_hf = true
last_save_model_only = true
last_save_in_hf = true
interval = 100
export_dtype = "bfloat16"
async_mode = "disabled"

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false

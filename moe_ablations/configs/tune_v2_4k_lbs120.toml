[job]
dump_folder = "./outputs/tune_v2_4k_lbs120"
description = "Tune v2 4k ctx lbs=120"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_tensorboard = false
enable_wandb = false
disable_color_printing = true

[model]
name = "qwen3_next"
flavor = "tune_v2"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
implementation = "fused"

[lr_scheduler]
warmup_steps = 2000
decay_type = "cosine"
min_lr_factor = 0

[training]
#global_batch_size = 1024
local_batch_size = 120
seq_len = 4096
max_norm = 1.0
steps = 10
dataset_type = "nanoset"
dataset_folders = ["/home/shared/datasets/fineweb-edu-v1_4-tokenized-qwen3", "/home/shared/datasets/dclm-baseline-1.0-tokenized-qwen3"]
dataset_weights = [1, 1]
gc_freq = 50

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
expert_parallel_degree = 1
expert_tensor_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "full"
selective_ac_option = "op"

[compile]
enable = true
fullgraph = false
components = ["model", "loss"]

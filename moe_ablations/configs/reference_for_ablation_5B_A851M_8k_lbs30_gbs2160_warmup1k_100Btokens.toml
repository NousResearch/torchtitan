[job]
dump_folder = "./outputs/reference_for_ablation_5B_A851M_8k_lbs30_gbs2160_warmup1k_100Btokens"
description = "Reference ablation: 5B_A851M 8k lbs30 gbs2160 (18M tokens) warmup1k 100B tokens rope_theta=500k"

[profiling]
enable_profiling = false

[metrics]
log_freq = 10
enable_tensorboard = false
enable_wandb = true
wandb_project = "moe_ablations"
disable_color_printing = true

[model]
name = "qwen3_next"
flavor = "5B_A851M_dim1024_hidden1536_L28_E256_inter192_rope500k"

[optimizer]
name = "AdamW"
lr = 3e-4 # same as llama2 lr
eps = 1e-8
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
implementation = "fused"

[lr_scheduler]
warmup_steps = 1130 # 20% warm up
decay_type = "cosine"
min_lr_factor = 0

[training]
global_batch_size = 2160 # 30 * 8 * 9 = 2160, gives 9x grad accum, 17.7M tokens/step ≈ 18M
local_batch_size = 30 # dp*lbs*seq_len = 8 * 30 * 8192 = 1.97M tokens per micro-step
seq_len = 8192
max_norm = 1.0
steps = 5650 # 100b tokens (5650 * 17.7M = 100B)
dataset_type = "nanoset"
dataset_folders = ["/home/shared/datasets/fineweb-edu-v1_4-tokenized-qwen3", "/home/shared/datasets/dclm-baseline-1.0-tokenized-qwen3"]
dataset_weights = [1, 1]
gc_freq = 50

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
expert_parallel_degree = 1
expert_tensor_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "full"
selective_ac_option = "op"

[compile]
enable = true
fullgraph = false
components = ["model", "loss"]

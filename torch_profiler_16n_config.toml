# 16-node PyTorch Profiler config - using built-in profiling

[job]
dump_folder = "./outputs/torch_profiler_16n"
description = "16N PyTorch Profiler: EP=128 CP=16 LBS=8"

[profiling]
enable_profiling = true
with_stack = true
with_modules = true
save_traces_folder = "traces"
profile_freq = 3          # Profile at step 3
profiler_warmup = 1       # 1 warmup step
profiler_active = 1       # Profile 1 step

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "/home/phuc/kimi_1t/torchtitan/assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4
state_dtype = "bfloat16"

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
dtype = "bfloat16"
local_batch_size = 8
seq_len = 32768
steps = 4                  # 4 steps: 1 wait + 1 warmup + 1 active + 1 buffer
dataset = "c4_test"
enable_cpu_offload = true
clear_cache_between_steps = true
skip_optimizer_step = false
aggressive_memory_mode = "maximum"
aggressive_memory_verbose = false

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 128
context_parallel_degree = 16

[activation_checkpoint]
mode = "full"

[compile]
enable = false

[debug]
moe_force_load_balance = true

[comm]
init_timeout_seconds = 1800
train_timeout_seconds = 1800

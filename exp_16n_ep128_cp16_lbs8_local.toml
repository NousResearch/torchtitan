# CP=16 LBS=8 sweep experiment: 16 nodes, EP=128, 32k context
# LOCAL ENV VERSION - Using local torchtitan from /home/phuc/004_kimi_1t_upstream_reference/torchtitan
[job]
dump_folder = "./outputs/cp_sweep_local/exp_16n_ep128_cp16_lbs8"
description = "CP sweep LOCAL: 16n EP=128 CP=16 LBS=8"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1

[model]
name = "deepseek_v3"
flavor = "kimi_k2"
hf_assets_path = "/home/phuc/kimi_1t/torchtitan/assets/hf/DeepSeek-V3-Base"

[optimizer]
name = "AdamW"
lr = 2.2e-4
state_dtype = "bfloat16"

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8

[training]
dtype = "bfloat16"
local_batch_size = 8
seq_len = 32768
steps = 5
dataset = "c4_test"
enable_cpu_offload = true
clear_cache_between_steps = true
skip_optimizer_step = false
aggressive_memory_mode = "maximum"
aggressive_memory_verbose = true

[parallelism]
data_parallel_shard_degree = -1
expert_parallel_degree = 128
context_parallel_degree = 16

[activation_checkpoint]
mode = "full"

[compile]
enable = true
components = ["loss"]

[debug]
moe_force_load_balance = true

[comm]
init_timeout_seconds = 1800
train_timeout_seconds = 1800
